<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xử lý đơn | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <main class="container py-4">
    <h1 class="h3 page-title">Xử lý đơn</h1>
    <p class="text-body-secondary" id="roleInfo">Đang tải...</p>

    <div id="actionState" class="alert alert-light border" role="status">Đang tải...</div>
    <section class="mb-4" aria-labelledby="invitedTitle"><h2 id="invitedTitle" class="h5">Lời mời <span class="badge text-bg-secondary" id="invitedCount">0</span></h2><div class="row g-3" id="invitedList"></div><p class="text-body-secondary small" id="invitedEmpty">Không có lời mời mới.</p></section>
    <section class="mb-4" aria-labelledby="todoTitle"><h2 id="todoTitle" class="h5">Cần xử lý <span class="badge text-bg-secondary" id="todoCount">0</span></h2><div class="row g-3" id="todoList"></div><p class="text-body-secondary small" id="todoEmpty">Không có việc cần xử lý.</p></section>
    <section class="mb-4" aria-labelledby="upcomingTitle"><h2 id="upcomingTitle" class="h5">Sắp tới <span class="badge text-bg-secondary" id="upcomingCount">0</span></h2><div class="row g-3" id="upcomingList"></div><p class="text-body-secondary small" id="upcomingEmpty">Không có nhiệm vụ sắp tới.</p></section>
    <section class="mb-4" aria-labelledby="toSendTitle"><h2 id="toSendTitle" class="h5">Cần mời</h2><p class="small text-body-secondary">Mời đối tác phù hợp cho các nhiệm vụ còn trống.</p><div class="row g-3" id="toSendList"></div><p class="text-body-secondary small" id="toSendEmpty">Không có nhiệm vụ cần mời.</p></section>
    <details class="mb-4"><summary class="h5">Đã xong <span class="badge text-bg-secondary" id="doneCount">0</span></summary><div class="row g-3 mt-1" id="doneList"></div><p class="text-body-secondary small" id="doneEmpty">Chưa có nhiệm vụ hoàn thành.</p></details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/actions.js"></script>
</body>
</html>
