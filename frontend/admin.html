<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thành viên | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 page-title">Thành viên</h1>
        <p class="text-body-secondary mb-0" id="adminHint">Danh sách thành viên đã được cấp vai trò trên blockchain.</p>
      </div>
      <!-- Chỉ quản trị viên (Account 0) mới thấy nút này -->
      <button class="btn btn-primary d-none" type="button" id="openMemberForm" data-bs-toggle="modal" data-bs-target="#memberModal">
        <i class="bi bi-person-plus me-1"></i>Cấp vai trò
      </button>
    </div>

    <div class="card">
      <div class="card-header bg-body">
        <div class="row g-2">
          <div class="col-md-6">
            <input class="form-control form-control-sm" id="memberSearch" type="search" placeholder="Tìm theo tên hoặc địa chỉ ví">
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select form-select-sm" id="roleFilter" aria-label="Lọc vai trò">
              <option value="">Mọi vai trò</option>
              <option value="1">Nhà sản xuất</option>
              <option value="2">Vận chuyển</option>
              <option value="3">Nhà phân phối</option>
              <option value="4">Nhà bán lẻ</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select form-select-sm" id="activeFilter" aria-label="Lọc trạng thái">
              <option value="">Mọi trạng thái</option>
              <option value="active">Đang hoạt động</option>
              <option value="inactive">Ngừng hoạt động</option>
            </select>
          </div>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Tên</th><th>Địa chỉ ví</th><th>Vai trò</th><th>Trạng thái</th></tr>
          </thead>
          <tbody id="memberBody"></tbody>
        </table>
      </div>
      <p class="text-center text-body-secondary small my-3" id="memberState">Đang tải...</p>
    </div>
  </main>

  <!-- ===== FORM CẤP VAI TRÒ (registerParticipant) ===== -->
  <div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="memberModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="memberForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="memberModalTitle">Cấp vai trò cho ví</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="memberAccount">Ví chưa có vai trò</label>
            <select class="form-select" id="memberAccount" name="account" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="memberName">Tên thành viên</label>
            <input class="form-control" id="memberName" name="name" maxlength="60" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="memberRole">Vai trò</label>
            <select class="form-select" id="memberRole" name="role">
              <option value="1">Nhà sản xuất</option>
              <option value="2">Vận chuyển</option>
              <option value="3">Nhà phân phối</option>
              <option value="4">Nhà bán lẻ</option>
            </select>
          </div>
          <div class="alert alert-danger py-2 small d-none mb-0" id="memberFormError" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Huỷ</button>
          <button type="submit" class="btn btn-primary">Ghi lên blockchain</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
