<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doanh nghiệp | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <!-- Trang công khai: ai cũng xem được, không cần ví -->
  <main class="container py-4">
    <!-- ===== DANH SÁCH ===== -->
    <section id="listView">
      <h1 class="h3 page-title">Doanh nghiệp trong chuỗi cung ứng</h1>
      <p class="text-body-secondary">Doanh nghiệp đã được duyệt. Vai trò và hoạt động đọc trực tiếp từ hợp đồng trên blockchain, ai cũng kiểm chứng được.</p>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input class="form-control" id="bizSearch" type="search" placeholder="Tìm theo tên, mã số thuế, địa chỉ">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="bizRole" aria-label="Lọc vai trò">
            <option value="">Mọi vai trò</option>
            <option value="1">Nhà sản xuất</option>
            <option value="2">Vận chuyển</option>
            <option value="3">Nhà phân phối</option>
            <option value="4">Nhà bán lẻ</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="bizShowRevoked">
            <label class="form-check-label small" for="bizShowRevoked">Hiện cả doanh nghiệp đã bị thu hồi</label>
          </div>
        </div>
      </div>
      <div class="row g-3" id="bizList"></div>
      <p class="text-center text-body-secondary small my-4" id="bizState">Đang tải...</p>
    </section>

    <!-- ===== CHI TIẾT MỘT DOANH NGHIỆP ===== -->
    <section class="d-none" id="detailView">
      <a class="small" href="businesses.html"><i class="bi bi-arrow-left me-1"></i>Tất cả doanh nghiệp</a>
      <div id="detailBody" class="mt-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/businesses.js"></script>
</body>
</html>
