<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <main class="container py-4">
    <h1 class="h3 page-title">Tổng quan</h1>
    <p class="text-body-secondary" id="welcome">Đang tải...</p>

    <!-- Tài khoản chưa được admin cấp vai trò trên blockchain -->
    <div class="alert alert-warning d-none" id="roleAlert">
      <i class="bi bi-hourglass-split me-1"></i>
      Ví của bạn chưa có vai trò trên blockchain. Hãy nhờ quản trị viên đăng ký ví này ở trang <a href="admin.html">Thành viên</a>.
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100"><div class="card-body d-flex gap-3 align-items-center">
          <span class="stat-icon text-bg-primary"><i class="bi bi-box-seam"></i></span>
          <div><div class="stat-value" id="totalProducts">–</div><div class="small text-body-secondary">Tổng sản phẩm</div></div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100"><div class="card-body d-flex gap-3 align-items-center">
          <span class="stat-icon text-bg-warning"><i class="bi bi-truck"></i></span>
          <div><div class="stat-value" id="inTransit">–</div><div class="small text-body-secondary">Đang vận chuyển</div></div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100"><div class="card-body d-flex gap-3 align-items-center">
          <span class="stat-icon text-bg-success"><i class="bi bi-bag-check"></i></span>
          <div><div class="stat-value" id="soldProducts">–</div><div class="small text-body-secondary">Đã bán</div></div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card h-100"><div class="card-body d-flex gap-3 align-items-center">
          <span class="stat-icon text-bg-info"><i class="bi bi-people"></i></span>
          <div><div class="stat-value" id="totalParticipants">–</div><div class="small text-body-secondary">Thành viên</div></div>
        </div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-body fw-semibold"><i class="bi bi-activity me-1"></i>Hoạt động gần đây</div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Sản phẩm</th><th>Trạng thái</th><th>Người thực hiện</th><th>Thời gian</th><th>Block</th></tr>
          </thead>
          <tbody id="activityBody"></tbody>
        </table>
      </div>
      <p class="text-center text-body-secondary small my-3" id="activityState">Đang tải...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
