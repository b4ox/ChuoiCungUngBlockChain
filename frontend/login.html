<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center py-4">
  <main class="container d-flex flex-column align-items-center">
    <a class="auth-brand mb-3" href="trace.html"><i class="bi bi-boxes me-2"></i>TraceChain</a>

    <div class="card auth-card shadow">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Đăng nhập</h1>
        <p class="text-body-secondary small mb-4">Đăng nhập để thao tác trên chuỗi cung ứng.</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Hiện mật khẩu">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="alert alert-danger py-2 small d-none" id="loginError" role="alert"></div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
          </button>
        </form>

        <p class="text-center small mt-3 mb-0">
          Chưa có tài khoản? <a href="register.html" id="registerLink">Đăng ký</a>
        </p>
      </div>

      <!-- Chỉ hiện khi đăng nhập đang giả lập: tạo nhanh 5 tài khoản ứng với Account 0–4 -->
      <div class="card-footer bg-body-tertiary p-4 d-none" id="demoBox">
        <p class="small fw-semibold mb-2"><i class="bi bi-lightning-charge me-1"></i>Tài khoản demo (mật khẩu <code>123456</code>)</p>
        <p class="small text-body-secondary mb-2" id="demoList">
          admin · nhasanxuat · vanchuyen · nhaphanphoi · banle
        </p>
        <button class="btn btn-outline-primary btn-sm w-100" type="button" id="createDemoButton">
          Tạo nhanh tài khoản demo
        </button>
      </div>
    </div>

    <a class="link-light small mt-3" href="trace.html"><i class="bi bi-search me-1"></i>Tra cứu sản phẩm không cần đăng nhập</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
