<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 page-title">Sản phẩm</h1>
        <p class="text-body-secondary mb-0">Mọi lô hàng đã ghi lên blockchain.</p>
      </div>
      <!-- Nhà sản xuất đã duyệt thấy nút này; nhà sản xuất chờ duyệt thấy nút bị khoá -->
      <button class="btn btn-primary d-none" type="button" id="openProductForm" data-bs-toggle="modal" data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-1"></i>Thêm sản phẩm
      </button>
      <span class="d-none" id="lockedProductButton" tabindex="0" title="Mở sau khi hồ sơ được duyệt">
        <button class="btn btn-primary" type="button" disabled><i class="bi bi-lock me-1"></i>Thêm sản phẩm (chờ duyệt)</button>
      </span>
    </div>

    <div class="card">
      <div class="card-header bg-body d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <span class="small text-body-secondary" id="productCount">Đang tải...</span>
        <select class="form-select form-select-sm w-auto" id="statusFilter" aria-label="Lọc theo trạng thái">
          <option value="">Tất cả trạng thái</option>
          <option value="0">Đã sản xuất</option>
          <option value="transit">Đang vận chuyển</option>
          <option value="2">Ở nhà phân phối</option>
          <option value="4">Ở cửa hàng</option>
          <option value="5">Đã bán</option>
        </select>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Sản phẩm</th><th>Nguồn gốc</th><th>Đang giữ</th><th>Trạng thái</th></tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
      <p class="text-center text-body-secondary small my-3" id="productState"></p>
    </div>
  </main>

  <!-- ===== FORM TẠO SẢN PHẨM ===== -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="productForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="productModalTitle">Thêm sản phẩm mới</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="productName">Tên sản phẩm / lô hàng</label>
            <input class="form-control" id="productName" name="name" maxlength="100" placeholder="Trà xanh Thái Nguyên – Lô 02" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="productOrigin">Nơi sản xuất</label>
            <input class="form-control" id="productOrigin" name="origin" maxlength="100" placeholder="Tân Cương, Thái Nguyên" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="productDescription">Mô tả</label>
            <textarea class="form-control" id="productDescription" name="description" rows="3" maxlength="300" required></textarea>
          </div>
          <p class="small text-body-secondary mb-2"><i class="bi bi-wallet2 me-1"></i>MetaMask sẽ hỏi xác nhận giao dịch; phí gas trả bằng ví của bạn.</p>
          <div class="alert alert-danger py-2 small d-none mb-0" id="productFormError" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Huỷ</button>
          <button type="submit" class="btn btn-primary">Ghi lên blockchain</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
