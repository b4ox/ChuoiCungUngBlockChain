<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu nguồn gốc | TraceChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="appNav"></div>

  <!-- Trang công khai: người tiêu dùng quét QR là xem được, không cần đăng nhập -->
  <main class="container py-4">
    <h1 class="h3 page-title">Tra cứu nguồn gốc</h1>
    <p class="text-body-secondary">Nhập mã sản phẩm (hoặc quét mã QR trên bao bì) để xem toàn bộ hành trình.</p>

    <form class="card card-body mb-4" id="traceForm" novalidate>
      <label class="form-label" for="traceId">Mã sản phẩm</label>
      <div class="input-group">
        <input class="form-control" id="traceId" inputmode="numeric" placeholder="Ví dụ: 1" required>
        <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Tra cứu</button>
      </div>
      <div class="small mt-2" id="traceState"></div>
    </form>

    <div class="d-none" id="traceResult">
      <div class="row g-3 mb-3">
        <!-- ===== THÔNG TIN SẢN PHẨM ===== -->
        <div class="col-lg-8">
          <div class="card h-100"><div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
              <h2 class="h5 fw-bold mb-0" id="traceName"></h2>
              <span id="traceStatus"></span>
            </div>
            <dl class="row small mb-0">
              <dt class="col-sm-4 text-body-secondary">Mã sản phẩm</dt><dd class="col-sm-8" id="traceCode"></dd>
              <dt class="col-sm-4 text-body-secondary">Nơi sản xuất</dt><dd class="col-sm-8" id="traceOrigin"></dd>
              <dt class="col-sm-4 text-body-secondary">Nhà sản xuất</dt><dd class="col-sm-8" id="traceManufacturer"></dd>
              <dt class="col-sm-4 text-body-secondary">Đang giữ hàng</dt><dd class="col-sm-8" id="traceOwner"></dd>
              <dt class="col-sm-4 text-body-secondary">Mô tả</dt><dd class="col-sm-8 mb-0" id="traceDescription"></dd>
            </dl>
          </div></div>
        </div>
        <!-- ===== MÃ QR ===== -->
        <div class="col-lg-4">
          <div class="card h-100"><div class="card-body text-center">
            <img class="qr-thumb img-fluid" id="qrImage" alt="Mã QR tra cứu sản phẩm" data-bs-toggle="modal" data-bs-target="#qrModal">
            <p class="small text-body-secondary mt-2 mb-0" id="qrLabel">Bấm vào mã để phóng to</p>
          </div></div>
        </div>
      </div>

      <!-- ===== THANH TIẾN TRÌNH 6 BƯỚC ===== -->
      <div class="card mb-3"><div class="card-body">
        <h2 class="h6 fw-semibold mb-3">Tiến trình</h2>
        <ol class="step-track" id="stepTrack"></ol>
      </div></div>

      <!-- ===== TIMELINE LỊCH SỬ ===== -->
      <div class="card"><div class="card-body">
        <h2 class="h6 fw-semibold mb-3">Lịch sử trên blockchain</h2>
        <ul class="timeline" id="timeline"></ul>
      </div></div>
    </div>
  </main>

  <div class="modal fade" id="qrModal" tabindex="-1" aria-label="Mã QR phóng to" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center">
          <img class="img-fluid" id="qrLarge" alt="Mã QR phóng to">
          <p class="small text-body-secondary mt-2 mb-0">Quét bằng điện thoại cùng mạng Wi-Fi</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/trace.js"></script>
</body>
</html>
